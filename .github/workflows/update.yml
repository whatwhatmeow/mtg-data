name: Update MTG card data
 
on:
  schedule:
    - cron: "17 9 1 * *"   # 1st of every month, ~4am Central
  workflow_dispatch:        # also lets you click "Run workflow" manually
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and slim Scryfall data
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Monthly card data update $(date -u +%F)"
          git push
 
